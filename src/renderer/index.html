<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">Atlas</div>
    <div class="cost" id="cost" tabindex="0" hidden></div>
    <div class="status" id="status" data-state="idle">
      <span class="dot"></span><span id="statusText">Kapalı</span>
    </div>
  </header>

  <section class="stage">
    <button class="orb" id="orb" aria-label="Bağlan">
      <canvas id="orbCanvas" width="520" height="520"></canvas>
    </button>
    <p class="hint" id="hint">Başlamak için dokun</p>
    <p class="meta" id="meta"></p>
  </section>

  <section class="transcript" id="transcript" aria-live="polite">
    <p class="empty" id="empty">Konuşma burada yazıya dökülecek.</p>
  </section>

  <div class="toast" id="toast" role="alert" hidden></div>

  <footer class="bar">
    <button class="icon-btn" id="mic" aria-label="Mikrofonu kapat" aria-pressed="true" title="Mikrofon (Ctrl+M)" disabled>
      <svg viewBox="0 0 24 24" class="i-on"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-2.07A7 7 0 0 0 19 12h-2Z"/></svg>
      <svg viewBox="0 0 24 24" class="i-off"><path d="M15 10.6V6a3 3 0 0 0-5.9-.8L15 11.1Zm4 1.4h-2a5 5 0 0 1-.4 2l1.5 1.5A7 7 0 0 0 19 12ZM4.3 3 3 4.3l6 6V12a3 3 0 0 0 4.4 2.7l1.5 1.5A5 5 0 0 1 7 12H5a7 7 0 0 0 6 6.9V21h2v-2.1a7 7 0 0 0 3.4-1.4l3.3 3.3 1.3-1.3Z"/></svg>
    </button>
    <form class="composer" id="composer" autocomplete="off">
      <input id="textInput" type="text" placeholder="Yaz ya da konuş…" disabled>
      <button class="icon-btn send" type="submit" aria-label="Gönder" disabled>
        <svg viewBox="0 0 24 24"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2Z"/></svg>
      </button>
    </form>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
